        if:
        - condition: state
          entity_id: input_boolean.kitchen_drugs_active
          state: 'off'
        - condition: or
          conditions:
          - condition: time
            after: '23:00:00'
          - condition: time
            before: '15:00:00'
        then:
        - if:
          - condition: or
            conditions:
            - condition: state
              entity_id: light.kuchnia_blat_lewy
              state: 'on'
            - condition: state
              entity_id: light.kuchnia_blat_prawy
              state: 'on'
            - condition: state
              entity_id: light.kuchnia_cokol
              state: 'on'
          then:
          - action: light.turn_off
            metadata: {}
            data: {}
            target:
              entity_id:
              - light.kuchnia_blat_lewy
              - light.kuchnia_blat_prawy
              - light.kuchnia_cokol
          else:
          - action: light.turn_on
            metadata: {}
            data:
              transition: 4
              brightness_pct: 50
            target:
              entity_id:
              - light.kuchnia_blat_lewy
              - light.kuchnia_blat_prawy
              - light.kuchnia_cokol
