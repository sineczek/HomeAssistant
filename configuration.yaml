homeassistant:
  name: Centrum dowodzenia
  latitude: !secret lat
  longitude: !secret long
  elevation: 431
  unit_system: metric
  time_zone: Europe/Warsaw
  currency: PLN
  country: PL
  customize: !include customize.yaml
  packages: !include_dir_named packages

frontend:
  themes: !include_dir_merge_named themes

system_health:

config:

mobile_app:

powercalc:
  enable_autodiscovery: false

stream:

energy:

http:
  server_port: 443
  ssl_certificate: /ssl/fullchain.pem
  ssl_key: /ssl/privkey.pem

conversation:

circadian_lighting:

sun:

cloud:

history:

recorder:
  db_url: !secret maria_db_url
  purge_keep_days: 32
  auto_purge: true
  commit_interval: 1

  include:
    domains:
      - sensor
      - switch
      - light
      - climate
      - fan
    entity_globs:
      - sensor.*energy*
      - sensor.netatmo_*
      - sensor.gas_*
      - sensor.*speedtest*
      - sensor.*battery*
      - weather.*
      - person.*

  exclude:
    domains:
      - camera
      - group
      - automation
      - binary_sensor
      - input_text
      - input_number
    entity_globs:
      - sensor.unifi*
      - sensor.wled*
      - sensor.*wifi_signal_strength
      - sensor.*_signal_strength
      - sensor.*signal
      - sensor.*bssid
    entities:
      - sensor.hacs
      - sensor.last_boot
      - sun.sun

logger:
  default: info

default_config:
python_script:
input_boolean:
input_select:

tts:
  - platform: google_translate

group: !include groups.yaml
# automation manual: !include_dir_merge_list automation/
automation ui: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
input_text: !include input_text.yaml
rest_command: !include rest_command.yaml
# themes: !include_dir_merge_named themes
