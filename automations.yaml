              state: 'on'
            - condition: state
              entity_id: light.kuchnia_blat_prawy
              state: 'on'
            - condition: state
              entity_id: light.kuchnia_cokol
              state: 'on'
          then:
          - action: light.turn_off
            metadata: {}
            data: {}
            target:
              entity_id:
              - light.kuchnia_blat_lewy
              - light.kuchnia_blat_prawy
              - light.kuchnia_cokol
          else:
          - action: light.turn_on
            metadata: {}
            data:
              transition: 4
              brightness_pct: 95
            target:
              entity_id:
